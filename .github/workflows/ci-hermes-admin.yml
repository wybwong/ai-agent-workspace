name: CI — hermes-admin

on:
  push:
    branches: [main]
    paths:
      - 'projects/hermes-admin/**'
  pull_request:
    branches: [main]
    paths:
      - 'projects/hermes-admin/**'
  workflow_dispatch:

env:
  BASE_PATH: /ai-agent-workspace/projects/hermes-admin/

jobs:
  build:
    name: Build hermes-admin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/hermes-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/hermes-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build
        run: npm run build -- --base=${{ env.BASE_PATH }}
