name: CI — Validate Template

on:
  push:
    branches: [main]
    paths:
      - '.github/agents/skills/vue3-vite-starter/template/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/agents/skills/vue3-vite-starter/template/**'
  workflow_dispatch:

jobs:
  validate-template:
    name: Build & Test vue3-vite-starter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/agents/skills/vue3-vite-starter/template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/agents/skills/vue3-vite-starter/template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
