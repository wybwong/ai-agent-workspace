name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/baby-food-poster/**'
      - 'projects/hermes-admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baby-food-poster
        working-directory: projects/baby-food-poster
        run: |
          npm ci
          npm run build -- --base=/ai-agent-workspace/projects/baby-food-poster/

      - name: Build hermes-admin
        working-directory: projects/hermes-admin
        run: |
          npm ci
          npm run build -- --base=/ai-agent-workspace/projects/hermes-admin/

      - name: Stage artifacts
        run: |
          mkdir -p _site/projects/baby-food-poster
          cp -r projects/baby-food-poster/dist/. _site/projects/baby-food-poster/

          mkdir -p _site/projects/hermes-admin
          cp -r projects/hermes-admin/dist/. _site/projects/hermes-admin/

          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI Agent Workspace</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
              h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
              ul { list-style: none; padding: 0; }
              li { margin: 12px 0; }
              a { color: #409eff; text-decoration: none; font-size: 1.1rem; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>🚀 AI Agent Workspace — Projects</h1>
            <ul>
              <li><a href="projects/hermes-admin/">hermes-admin — Vue 3 后台管理系统</a></li>
              <li><a href="projects/baby-food-poster/">baby-food-poster — 婴儿辅食海报生成器</a></li>
            </ul>
          </body>
          </html>
          EOF

      # actions/upload-pages-artifact runs from repo root, not affected by defaults.run.working-directory
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
